name: Build Quest APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Quest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-32" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: handheld/project/quest
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-quest-debug
          path: handheld/project/quest/app/build/outputs/apk/debug/app-debug.apk
